[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "design2fusion"
version = "0.2.0"
description = "Convierte diseños de Figma, Penpot y FigCraft en nodos de Fusion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["Pillow"]

[project.scripts]
design2fusion = "d2f.cli:main"

[tool.setuptools]
packages = ["d2f"]
